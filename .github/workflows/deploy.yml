name: Deploy To Servers

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      deploy_journal:
        description: Deploy Journal to rndc02
        required: true
        type: boolean
        default: true
      deploy_bot:
        description: Deploy bot to bwgdc01
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      journal: ${{ steps.scope.outputs.journal }}
      bot: ${{ steps.scope.outputs.bot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed deployment scope
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            journal:
              - 'src/journal-server/**'
              - 'src/shared/**'
              - 'web/**'
              - 'deploy/journal/**'
              - 'scripts/journal-backup'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - '.github/workflows/deploy.yml'
            bot:
              - 'src/*.ts'
              - 'src/ai/**'
              - 'src/bot/**'
              - 'src/calendar/**'
              - 'src/config/**'
              - 'src/fetchers/**'
              - 'src/formatters/**'
              - 'src/journal-bot/**'
              - 'src/publishers/**'
              - 'src/reminders/**'
              - 'src/scheduled/**'
              - 'src/services/**'
              - 'src/shared/**'
              - 'src/utils/**'
              - 'deploy/notinews-bot.service'
              - 'deploy/notinews-backup.service'
              - 'deploy/notinews-backup.timer'
              - 'deploy/notinews-failure-notify@.service'
              - 'scripts/install-video-download-tools'
              - 'scripts/notinews-backup'
              - 'scripts/notinews-video-worker'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - '.github/workflows/deploy.yml'

      - name: Resolve deployment scope
        id: scope
        env:
          PUSH_JOURNAL: ${{ steps.paths.outputs.journal }}
          PUSH_BOT: ${{ steps.paths.outputs.bot }}
          MANUAL_JOURNAL: ${{ inputs.deploy_journal }}
          MANUAL_BOT: ${{ inputs.deploy_bot }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "journal=$MANUAL_JOURNAL" >> "$GITHUB_OUTPUT"
            echo "bot=$MANUAL_BOT" >> "$GITHUB_OUTPUT"
          else
            echo "journal=$PUSH_JOURNAL" >> "$GITHUB_OUTPUT"
            echo "bot=$PUSH_BOT" >> "$GITHUB_OUTPUT"
          fi

  journal:
    needs: changes
    if: needs.changes.outputs.journal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOURNAL_SERVER_HOST: ${{ secrets.JOURNAL_SERVER_HOST }}
      JOURNAL_SERVER_PORT: ${{ secrets.JOURNAL_SERVER_PORT }}
      JOURNAL_SERVER_USER: ${{ secrets.JOURNAL_SERVER_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Journal secrets
        run: |
          test -n "$JOURNAL_SERVER_HOST"
          test -n "$JOURNAL_SERVER_USER"
          test -n "${{ secrets.JOURNAL_SERVER_SSH_KEY }}"
          test -n "${{ secrets.JOURNAL_SERVER_KNOWN_HOSTS }}"

      - name: Build immutable Journal image
        run: |
          docker build \
            --file deploy/journal/Dockerfile \
            --tag "notinews-journal:$GITHUB_SHA" \
            .
          docker save "notinews-journal:$GITHUB_SHA" > "/tmp/journal-$GITHUB_SHA.tar"
          tar --create \
            --file "/tmp/journal-host-$GITHUB_SHA.tar" \
            scripts/journal-backup \
            deploy/journal/deploy-release \
            deploy/journal/journal-backup.service \
            deploy/journal/journal-backup.timer

      - name: Setup Journal SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.JOURNAL_SERVER_SSH_KEY }}

      - name: Install trusted Journal host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.JOURNAL_SERVER_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Journal image
        run: |
          PORT="${JOURNAL_SERVER_PORT:-22}"
          tar -C /tmp -cf - \
            "journal-$GITHUB_SHA.tar" \
            "journal-host-$GITHUB_SHA.tar" | \
            ssh -p "$PORT" "$JOURNAL_SERVER_USER@$JOURNAL_SERVER_HOST" \
              "tar -xf - -C /var/lib/journal-deploy/incoming"

      - name: Activate Journal release
        run: |
          PORT="${JOURNAL_SERVER_PORT:-22}"
          ssh -p "$PORT" "$JOURNAL_SERVER_USER@$JOURNAL_SERVER_HOST" \
            "sudo -n /usr/local/sbin/journal-deploy-release '$GITHUB_SHA' --install-host-assets"

      - name: Notify Journal deploy success to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASE_TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          MSG="$(printf '✅ Journal 已更新\n发布时间: %s\nCommit: %s\n服务: feeds.xmcloud.buzz' "$RELEASE_TIME" "$SHORT_SHA")"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null

  bot:
    needs:
      - changes
      - journal
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bot == 'true' &&
      (needs.journal.result == 'success' || needs.journal.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PROJECT_DIR: ${{ secrets.SERVER_PROJECT_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bot secrets
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PROJECT_DIR"

      - name: Setup bot SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add bot server to known_hosts
        run: |
          PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure bot project directory exists
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_PROJECT_DIR'"

      - name: Sync tracked bot files
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PROJECT_DIR' && \
            find . -mindepth 1 -maxdepth 1 ! -name '.env' ! -name '.npmrc' ! -name 'data' -exec rm -rf {} +"
          git archive --format=tar HEAD | \
            ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "tar -xf - -C '$SERVER_PROJECT_DIR'"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "printf '%s\n' '$GITHUB_SHA' > '$SERVER_PROJECT_DIR/.deploy-commit'"

      - name: Install bot dependencies on server
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd '$SERVER_PROJECT_DIR'
            if ! command -v node >/dev/null 2>&1; then
              echo 'Node.js is missing on server' >&2
              exit 1
            fi
            if ! command -v pnpm >/dev/null 2>&1; then
              timeout 180 npm install -g pnpm@11.15.0 --registry=https://registry.npmmirror.com --fetch-retries=1 --fetch-timeout=30000 --loglevel warn
            fi
            export npm_config_disturl=https://npmmirror.com/mirrors/node
            pnpm install --frozen-lockfile
          "

      - name: Install bot media tools
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            install -m 755 '$SERVER_PROJECT_DIR/scripts/install-video-download-tools' /usr/local/sbin/install-video-download-tools
            /usr/local/sbin/install-video-download-tools
          "

      - name: Setup bot service
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            systemctl stop notinews.timer || true
            systemctl disable notinews.timer || true
            cp '$SERVER_PROJECT_DIR/deploy/notinews-bot.service' /etc/systemd/system/notinews-bot.service
            cp '$SERVER_PROJECT_DIR/deploy/notinews-failure-notify@.service' /etc/systemd/system/notinews-failure-notify@.service
            install -m 755 '$SERVER_PROJECT_DIR/scripts/notinews-backup' /usr/local/sbin/notinews-backup
            install -m 644 '$SERVER_PROJECT_DIR/deploy/notinews-backup.service' /etc/systemd/system/notinews-backup.service
            install -m 644 '$SERVER_PROJECT_DIR/deploy/notinews-backup.timer' /etc/systemd/system/notinews-backup.timer
            systemctl daemon-reload
            systemctl enable notinews-bot.service
            systemctl enable --now notinews-backup.timer
            systemctl restart notinews-bot.service
            sleep 2
            systemctl status notinews-bot.service --no-pager -l | sed -n '1,20p'
          "

      - name: Notify bot deploy success to Telegram
        run: |
          PORT="${SERVER_PORT:-22}"
          SHORT_SHA="${GITHUB_SHA::7}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd '$SERVER_PROJECT_DIR'
            set -a
            . ./.env
            set +a
            if [ -z \"\$TG_TOKEN\" ] || [ -z \"\$TG_CHAT_ID\" ]; then
              echo 'TG_TOKEN or TG_CHAT_ID is missing in .env' >&2
              exit 1
            fi
            RELEASE_TIME=\$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')
            BOT_STATUS=\$(systemctl is-active notinews-bot.service || echo unknown)
            MSG=\$(printf '✅ NotiNews Bot 已更新\n发布时间: %s\nCommit: %s\nBot 状态: %s' \"\${RELEASE_TIME}\" \"${SHORT_SHA}\" \"\${BOT_STATUS}\")
            curl -sS -X POST \"https://api.telegram.org/bot\${TG_TOKEN}/sendMessage\" \
              --data-urlencode \"chat_id=\${TG_CHAT_ID}\" \
              --data-urlencode \"text=\${MSG}\" >/dev/null
          "
