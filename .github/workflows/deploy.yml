name: Deploy To Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PROJECT_DIR: ${{ secrets.SERVER_PROJECT_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PROJECT_DIR"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure project directory exists
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_PROJECT_DIR'"

      - name: Sync tracked files
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PROJECT_DIR' && \
            find . -mindepth 1 -maxdepth 1 ! -name '.env' ! -name '.npmrc' ! -name 'data' -exec rm -rf {} +"
          git archive --format=tar HEAD | \
            ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "tar -xf - -C '$SERVER_PROJECT_DIR'"

      - name: Install dependencies on server
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd '$SERVER_PROJECT_DIR'
            if ! command -v node >/dev/null 2>&1; then
              echo 'Node.js is missing on server' >&2
              exit 1
            fi
            if ! command -v pnpm >/dev/null 2>&1; then
              timeout 180 npm install -g pnpm@10.33.2 --registry=https://registry.npmmirror.com --fetch-retries=1 --fetch-timeout=30000 --loglevel warn
            fi
            export npm_config_disturl=https://npmmirror.com/mirrors/node
            pnpm install --frozen-lockfile
          "

      - name: Setup bot service
        run: |
          PORT="${SERVER_PORT:-22}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            # Stop and disable old timer-based service
            systemctl stop notinews.timer || true
            systemctl disable notinews.timer || true
            # Install new bot service
            cp '$SERVER_PROJECT_DIR/deploy/notinews-bot.service' /etc/systemd/system/notinews-bot.service
            systemctl daemon-reload
            systemctl enable notinews-bot.service
            systemctl restart notinews-bot.service
            sleep 2
            systemctl status notinews-bot.service --no-pager -l | sed -n '1,20p'
          "

      - name: Notify deploy success to Telegram
        run: |
          PORT="${SERVER_PORT:-22}"
          SHORT_SHA="${GITHUB_SHA::7}"
          ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd '$SERVER_PROJECT_DIR'
            set -a
            . ./.env
            set +a
            if [ -z \"\$TG_TOKEN\" ] || [ -z \"\$TG_CHAT_ID\" ]; then
              echo 'TG_TOKEN or TG_CHAT_ID is missing in .env' >&2
              exit 1
            fi
            RELEASE_TIME=\$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')
            BOT_STATUS=\$(systemctl is-active notinews-bot.service || echo unknown)
            MSG=\$(printf '✅ NotiNews Bot 已更新\n发布时间: %s\nCommit: %s\nBot 状态: %s\n\n交互 bot 已切换为常驻模式。' \"\${RELEASE_TIME}\" \"${SHORT_SHA}\" \"\${BOT_STATUS}\")
            curl -sS -X POST \"https://api.telegram.org/bot\${TG_TOKEN}/sendMessage\" \
              --data-urlencode \"chat_id=\${TG_CHAT_ID}\" \
              --data-urlencode \"text=\${MSG}\" >/dev/null
          "
