<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">小明同学头像</title>
  <desc id="description">柔和渐变圆形背景上的明字</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c6a5"/>
      <stop offset="0.5" stop-color="#db8d77"/>
      <stop offset="1" stop-color="#8d6a9f"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#background)"/>
  <circle cx="256" cy="256" r="248" fill="url(#light)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#fff" stroke-opacity="0.32" stroke-width="8"/>
  <text x="224" y="334" fill="#fffaf4" font-family="STKaiti, KaiTi, serif" font-size="224" font-weight="600" text-anchor="middle">明</text>
</svg>
