server {
    listen 80;
    listen [::]:80;
    server_name lu.xmcloud.buzz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lu.xmcloud.buzz;

    ssl_certificate /etc/nginx/certs/lu.xmcloud.buzz_cert.pem;
    ssl_certificate_key /etc/nginx/certs/lu.xmcloud.buzz_key.pem;

    location / {
        proxy_pass http://notinews-lu-dashboard:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
