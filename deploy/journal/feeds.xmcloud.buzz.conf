server {
    listen 80;
    listen [::]:80;
    server_name feeds.xmcloud.buzz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feeds.xmcloud.buzz;

    ssl_certificate /www/sites/feeds.xmcloud.buzz/ssl/origin.pem;
    ssl_certificate_key /www/sites/feeds.xmcloud.buzz/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/sites/feeds.xmcloud.buzz/logs/access.log;
    error_log /www/sites/feeds.xmcloud.buzz/logs/error.log;

    client_max_body_size 2m;

    location ~ ^/(?:me(?:/|$)|api/(?:me|auth|internal)(?:/|$)) {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
